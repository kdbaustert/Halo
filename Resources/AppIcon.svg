<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0B1026"/>
    </linearGradient>
    <radialGradient id="glow" cy=".45">
      <stop offset="0" stop-color="#64D2FF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#64D2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screen">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9BE4FF"/>
    </radialGradient>
  </defs>
  <!-- Drawn on a 100-unit grid, then scaled to Apple's 824px icon body inside the 1024 canvas. -->
  <g transform="translate(100 100) scale(9.3636) translate(-6 -6)">
    <rect x="6" y="6" width="88" height="88" rx="19.8" fill="url(#background)"/>
    <circle cx="50" cy="45" r="38" fill="url(#glow)"/>
    <rect x="22" y="26" width="56" height="38" rx="4" fill="#2C2C2E" stroke="#8E8E93" stroke-width="1"/>
    <rect x="25" y="29" width="50" height="32" rx="2" fill="url(#screen)"/>
    <rect x="16" y="66" width="68" height="6" rx="3" fill="#C7C7CC"/>
  </g>
</svg>
