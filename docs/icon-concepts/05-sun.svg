  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#b)"/><g filter="url(#soft)"><circle cx="512" cy="512" r="150" fill="#fff" /><line x1="744.5" y1="512.0" x2="819.5" y2="512.0" stroke="#fff" stroke-width="50" stroke-linecap="round" /><line x1="676.4" y1="676.4" x2="729.4" y2="729.4" stroke="#fff" stroke-width="50" stroke-linecap="round" /><line x1="512.0" y1="744.5" x2="512.0" y2="819.5" stroke="#fff" stroke-width="50" stroke-linecap="round" /><line x1="347.6" y1="676.4" x2="294.6" y2="729.4" stroke="#fff" stroke-width="50" stroke-linecap="round" /><line x1="279.5" y1="512.0" x2="204.5" y2="512.0" stroke="#fff" stroke-width="50" stroke-linecap="round" /><line x1="347.6" y1="347.6" x2="294.6" y2="294.6" stroke="#fff" stroke-width="50" stroke-linecap="round" /><line x1="512.0" y1="279.5" x2="512.0" y2="204.5" stroke="#fff" stroke-width="50" stroke-linecap="round" /><line x1="676.4" y1="347.6" x2="729.4" y2="294.6" stroke="#fff" stroke-width="50" stroke-linecap="round" /></g>
