    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#002d82"/></linearGradient><radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff7cc" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd60a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#b)"/><rect x="214" y="600" width="96" height="160" rx="48" fill="#fff" opacity="0.35"/><rect x="334" y="510" width="96" height="250" rx="48" fill="#fff" opacity="0.5"/><rect x="454" y="420" width="96" height="340" rx="48" fill="#fff" opacity="0.65"/><rect x="574" y="330" width="96" height="430" rx="48" fill="#fff" opacity="0.8"/><circle cx="742" cy="300" r="170" fill="url(#g)"/><rect x="694" y="230" width="96" height="530" rx="48" fill="#fff" filter="url(#soft)"/><rect x="694" y="230" width="96" height="530" rx="48" fill="#ffd60a" opacity=".25"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
